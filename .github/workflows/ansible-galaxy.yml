name: Release Role to Ansible Galaxy

on:
  # allow to manual run the action
  workflow_dispatch: { }
  push:
    tags:
      - '*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Ansible Galaxy Import
        run: |
          ansible-galaxy role import cloudtooling ansible-role-springboot --token {{ secrets.ANSIBLE_GALAXY_API_TOKEN }}"
